<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where To Swim</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>🏖️ Where To Swim</h1>
    <p class="subtitle">Find a nearby beach with calm water, right now.</p>
  </header>

  <main>
    <section class="controls card">
      <div class="location-row">
        <button id="use-location-btn" type="button">📍 Use my location</button>
        <span id="location-status"></span>
      </div>

      <div class="search-row">
        <input id="place-input" type="text" placeholder="Or search a place (e.g. Ierissos, Sithonia)" autocomplete="off" />
        <div id="place-results" class="place-results"></div>
      </div>

      <div class="options-row">
        <label><input type="checkbox" id="toddler-check" checked /> Traveling with a toddler</label>
        <label><input type="checkbox" id="bar-check" checked /> Needs a beach bar / toilet</label>
        <label>
          Max wave height:
          <select id="max-wave-select">
            <option value="0.2">0.2 m &mdash; glassy calm</option>
            <option value="0.3" selected>0.3 m &mdash; toddler-safe</option>
            <option value="0.5">0.5 m &mdash; light chop OK</option>
            <option value="1.0">1.0 m &mdash; don't filter much</option>
          </select>
        </label>
        <label>
          Max wind:
          <select id="max-wind-select">
            <option value="1">Bft 1 &mdash; light air</option>
            <option value="2">Bft 2 &mdash; light breeze</option>
            <option value="3" selected>Bft 3 &mdash; gentle breeze (toddler-safe)</option>
            <option value="4">Bft 4 &mdash; moderate breeze</option>
            <option value="5">Bft 5 &mdash; fresh breeze</option>
            <option value="6">Bft 6 &mdash; strong breeze</option>
          </select>
        </label>
        <label>
          Search radius:
          <select id="radius-select">
            <option value="15">15 km</option>
            <option value="30" selected>30 km</option>
            <option value="60">60 km</option>
            <option value="120">120 km (whole peninsula)</option>
          </select>
        </label>
      </div>

      <button id="find-btn" type="button" class="primary">Find calm beaches</button>
    </section>

    <section id="results"></section>
  </main>

  <footer>
    <p>Wind, wave and place data from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (free, no API key). Beach details (orientation, bars, crowd levels) are curated by hand and may be out of date &mdash; edit <code>beaches.json</code> to fix or extend them.</p>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
