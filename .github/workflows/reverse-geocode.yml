name: Reverse Geocode Unnamed Beaches (manual)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Geocode all candidates, only unnamed ones, or only unnamed but restricted to --regions"
        required: false
        default: "unnamed"
        type: choice
        options:
          - unnamed
          - all
      regions:
        description: "Comma-separated region names to restrict to (any named+unnamed points in these regions, overrides scope)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pull input data from osm-bulk-review branch
        run: git show origin/osm-bulk-review:osm_bulk_beaches.json > osm_bulk_beaches.json
      - name: Run reverse geocoding
        run: |
          FLAG=""
          if [ "${{ inputs.scope }}" = "all" ]; then FLAG="--all"; fi
          if [ -n "${{ inputs.regions }}" ]; then FLAG="--regions=${{ inputs.regions }}"; fi
          python -u scripts/reverse_geocode.py "$FLAG"
      - uses: actions/upload-artifact@v4
        with:
          name: geocode-results-${{ inputs.scope }}
          path: geocode_results.json
          retention-days: 7
      - name: Commit result to osm-bulk-review branch
        run: |
          git config user.name "geocode-bot"
          git config user.email "actions@github.com"
          OUT_NAME="geocode_results.json"
          if [ -n "${{ inputs.regions }}" ]; then OUT_NAME="geocode_results_regions.json"; fi
          rm -f osm_bulk_beaches.json  # avoid conflicting with the tracked copy on osm-bulk-review
          mv geocode_results.json /tmp/geocode_results_new.json  # move out of the way; osm-bulk-review may already track a file with this name
          git checkout osm-bulk-review
          cp /tmp/geocode_results_new.json "$OUT_NAME"
          git add -f "$OUT_NAME"
          git commit -m "Reverse geocode results (scope=${{ inputs.scope }}, regions=${{ inputs.regions }}, run ${{ github.run_id }})" || echo "nothing to commit"
          git push origin osm-bulk-review
