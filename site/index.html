<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where To Swim</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🏖️ Where To Swim</h1>
    <p class="subtitle">Find a nearby beach with calm water, right now.</p>
  </header>

  <main>
    <section class="controls card">
      <div class="location-row">
        <button id="use-location-btn" type="button">📍 Use my location</button>
        <span id="location-status"></span>
      </div>

      <div class="search-row">
        <input id="place-input" type="text" placeholder="Or search a place (e.g. Ierissos, Sithonia)" autocomplete="off" />
        <div id="place-results" class="place-results"></div>
      </div>

      <div class="options-row">
        <label><input type="checkbox" id="toddler-check" checked /> Traveling with a toddler</label>
        <label><input type="checkbox" id="bar-check" checked /> Needs a beach bar / toilet</label>
        <label>
          Search radius:
          <select id="radius-select">
            <option value="15">15 km</option>
            <option value="30" selected>30 km</option>
            <option value="60">60 km</option>
            <option value="120">120 km (whole peninsula)</option>
          </select>
        </label>
      </div>

      <button id="find-btn" type="button" class="primary">Find calm beaches</button>
    </section>

    <section id="results"></section>
  </main>

  <footer>
    <p>Wind, wave and place data from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (free, fetched directly from your browser, no key needed). Beach details (orientation, bars, crowd levels) are curated by hand and may be out of date.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
